<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedule Deck - Bus Broadcaster</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #05060a; --panel: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1); --text: #e8ecff;
      --cyan: #00ffff; --accent: #ffd25f; --danger: #ff5c7a; --good: #5dffb7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; overflow: hidden;
    }
    .schedule-header {
      height: 60px; padding: 0 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      letter-spacing: 2px; font-weight: 800; font-size: 14px; color: var(--cyan);
    }
    .timeline-container {
      position: relative; flex: 1; overflow-x: auto; overflow-y: hidden;
      white-space: nowrap; padding: 40px 0; height: calc(100% - 60px);
      background: linear-gradient(to bottom, #05060a 0%, #0a0b10 100%);
    }
    /* 1 hour = 400px wide */
    .timeline { position: relative; height: 200px; min-width: 9600px; border-top: 1px solid rgba(255,255,255,0.05); }
    
    .timeline-mark {
      position: absolute; top: -20px; font-size: 9px; opacity: 0.3;
      border-left: 1px solid rgba(255,255,255,0.1); height: 240px; padding-left: 4px;
    }

    .timeline-item {
      position: absolute; height: 80px; top: 60px;
      background: var(--panel); border-left: 2px solid var(--cyan);
      box-shadow: inset 0 0 10px rgba(0,255,255,0.05);
      display: flex; flex-direction: column; justify-content: center; padding: 0 10px;
      overflow: hidden; font-size: 10px; cursor: pointer; transition: transform 0.2s;
    }
    .timeline-item:hover { background: rgba(0,255,255,0.1); transform: scaleY(1.1); }
    .timeline-item.active { background: rgba(0,255,255,0.2); border-color: var(--good); z-index: 10; }
    .timeline-item.station-id { border-color: var(--accent); background: rgba(255,210,95,0.05); }

    .item-title { font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-duration { opacity: 0.4; font-size: 8px; }

    .live-line {
      position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger);
      box-shadow: 0 0 10px var(--danger); z-index: 100; pointer-events: none;
    }
    .live-dot {
      position: absolute; top: -5px; left: -4px; width: 10px; height: 10px;
      background: var(--danger); border-radius: 50%;
    }
    
    #current-time-display { font-size: 24px; color: #fff; font-weight: 800; }
  </style>
</head>
<body>

  <div class="schedule-header">
     <span>STATION RUNSHEET</span>
     <div id="current-time-display">00:00:00</div>
     <div style="font-size: 10px; opacity: 0.5;">24H TIMELINE</div>
  </div>

  <div class="timeline-container" id="scroller">
     <div class="timeline" id="timeline">
        <div class="live-line" id="live-line"><div class="live-dot"></div></div>
        <div id="time-marks"></div>
        <div id="blocks-container"></div>
     </div>
  </div>

  <script src="./src/storage.js"></script>
  <script src="./src/bus.js"></script>
  <script src="./src/schedule_deck.js"></script>
</body>
</html>
